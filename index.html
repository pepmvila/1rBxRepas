let it=e.items[e.index];return `<div class="examhead"><div><div class="eyebrow">SIMULACRE · SENSE PISTES</div><h2>Pregunta ${e.index+1} de ${e.items.length}</h2></div><button class="secondary" onclick="exitExam()">✕ Sortir</button></div><div class="examtrack"><div style="width:${e.index/e.items.length*100}%"></div></div><p class="prompt">${esc(it.q.prompt)}</p><div class="mathline" data-tex="${esc(it.q.expr)}"></div><div class="label">Selecciona la resposta (no podràs tornar enrere)</div><div class="choices">${it.q.options.map((opt,i)=>`<button class="choice" onclick="answerExam(${i})"><span data-tex="${esc(opt)}"></span></button>`).join('')}</div><p class="note">Apartats barrejats · nivell ${['','Fàcil','Mitjà','Difícil'][it.level]} · correcció al final</p>`}
function render(){let unit=units.find(u=>u.id===state.u),q=state.q;if(!q){state.q=safeQuestion(state.sub,state.level);q=state.q}let studied=Object.values(state.history).reduce((a,v)=>a+v.total,0),pc=state.attempts?Math.round(100*state.right/state.attempts):0;const suggest=state.streak>=5&&state.level<3?'up':(state.missStreak>=3&&state.level>1?'down':null);
$('#app').innerHTML=`<div class="layout"><aside class="side"><div class="brand"><div class="logo">ƒ</div><div><b>1a Avaluació<br>CCSS</b><small>1r de Batxillerat</small></div></div><div class="navhead">Blocs de pràctica</div><div class="navlist">${units.map(u=>`<div class="navgroup"><button class="navbtn ${u.id===state.u?'active':''}" aria-expanded="${u.id===state.u}" onclick="setUnit('${u.id}')"><span style="font-size:18px;min-width:26px;text-align:center">${u.icon}</span><span style="flex:1">${u.name}</span><span class="num">${u.sub.length}</span><span class="chevron">${u.id===state.u?'▾':'▸'}</span></button>${u.id===state.u?`<div class="navsublist">${u.sub.map(sub=>`<button class="navsub ${sub[0]===state.sub?'active':''}" ${sub[0]===state.sub?'aria-current="page"':''} onclick="setSub('${sub[0]}')">${sub[1]}</button>`).join('')}</div>`:''}</div>`).join('')}</div><div class="footer">Versió de pràctica · sense iniciar sessió<br>Estadístiques desades en aquest navegador.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">PRÀCTICA GUIADA · MATEMÀTIQUES</div><h1 class="title">${state.exam?'Simulacre d’examen':unit.name}</h1><p class="desc">${state.exam?'10 preguntes barrejades · correcció final': 'Selecciona un tipus d’exercici al menú lateral i practica al teu ritme.'}</p></div><div class="pill">${state.right} encerts · ${state.attempts} intents</div></div><div class="two"><div><section class="panel">${state.exam?examHtml():`<div class="tools"><div class="seg" role="group" aria-label="Dificultat">${['Fàcil','Mitjà','Difícil'].map((v,i)=>`<button class="${i+1===state.level?'on':''}" onclick="setLevel(${i+1})">${v}</button>`).join('')}</div><div class="actions"><button class="secondary" onclick="beginExam()">📝 Simulacre (10)</button><button class="primary" onclick="next()">↻ Nou exercici</button></div></div>${suggest?`<div class="adaptive">${suggest==='up'?'Has encertat 5 exercicis seguits. Vols provar un nivell més difícil?':'Si aquest nivell et costa, pots practicar-ne un de més accessible.'} <button class="secondary" onclick="setLevel(${state.level+(suggest==='up'?1:-1)})">Provar ${suggest==='up'?'nivell superior':'nivell inferior'}</button></div>`:''}<div class="challenge"><div class="label">EXERCICI ${state.attempts+1} · ${unit.sub.find(s=>s[0]===state.sub)[1]}</div><div class="prompt">${esc(q.prompt)}</div><div class="mathline" data-tex="${esc(q.expr)}"></div></div>${state.guided&&!state.answered?guideHtml():''}${(!state.guided||state.guideStep===2||state.answered)?`<div class="label">Selecciona la resposta correcta</div><div class="choices">${q.options.map((opt,i)=>`<button class="choice ${state.answered?(opt===q.correct?'ok':i===state.selected?'bad':''):''}" onclick="selectAnswer(${i})" ${state.answered?'disabled':''}><span data-tex="${esc(opt)}"></span></button>`).join('')}</div>`:''}${state.answered?`<div class="feedback ${q.options[state.selected]===q.correct?'':'bad'}">${q.options[state.selected]===q.correct?'✓ Molt bé! Has encertat.':'✕ La resposta correcta està marcada en verd.'}</div><div class="problemstage"><b>Resolució explicada</b><ol class="solutionsteps"><li><b>Identifica l'estratègia.</b> ${esc(q.hint)}</li><li><b>Transforma i calcula.</b> ${q.workingEquation?`<div class="smallmath" data-tex="${esc(q.workingEquation)}"></div>`:''}${esc(q.explanation)}</li><li><b>Resposta correcta.</b> <span data-tex="${esc(q.correct)}"></span></li></ol></div><div class="actions"><button class="primary" onclick="next()">Següent exercici →</button></div>`:state.guided?'':`<div class="actions"><button class="secondary" onclick="toggleHint()">💡 Pista</button><button class="primary" onclick="startGuide()">🧭 Vull anar pas a pas</button><button class="secondary" onclick="toggleKeyboard()">⌨ Espai de treball</button><button class="secondary" onclick="reveal()">Veure la resolució</button></div><div id="hintarea"></div>`}${!state.guided?`<div id="workarea">${state.keyboard?keyboardHtml():''}</div>`:''}`}</section></div><div class="asidepanel"><section class="panel"><div class="minihead">El teu progrés</div><div class="statrow"><div class="stat"><strong>${pc}%</strong><small>Percentatge d’encerts</small></div><div class="stat"><strong>${state.streak}</strong><small>Ratxa actual</small></div></div><div class="progress"><div style="width:${pc}%"></div></div><p class="note">${studied} activitats resoltes en aquest navegador. El percentatge indica encerts ÷ intents, no temari completat.</p><div class="minihead">Resultats per bloc</div>${topicStats().map(t=>`<div class="topicstat"><div><span>${esc(t.name)}</span><b>${t.total?Math.round(t.ok/t.total*100)+'%':'—'}</b></div><div class="progress"><div style="width:${t.total?100*t.ok/t.total:0}%"></div></div><small>${t.ok}/${t.total} encerts</small></div>`).join('')}<button class="secondary" onclick="resetStats()" style="font-size:12px">Reinicia les estadístiques</button></section><section class="panel"><div class="minihead">📖 Teoria i exemples</div><p class="desc">Recorda les propietats bàsiques abans de practicar.</p><div class="outline">${theory[state.u].slice(0,3).map(t=>`<p>• ${t[0]}</p>`).join('')}</div><button class="secondary" onclick="showTheory()">Obre la teoria →</button><div class="minihead" style="margin-top:24px">Com funciona el simulacre?</div><p class="note">10 exercicis barrejats, sense pistes ni resolució fins al final. Els resultats també compten a les estadístiques.</p><button class="secondary" onclick="beginExam()" ${state.exam?'disabled':''}>Comença el simulacre</button></section></div></div><div class="footer">Nivell Mitjà per defecte. El mode pas a pas orienta el procediment; l’esborrany no té correcció simbòlica automàtica.</div></main></div>${state.theory?theoryModal():''}`;renderMath()}
function toggleHint(){let a=$('#hintarea');a.innerHTML=a.innerHTML?'':`<div class="hint">💡 ${esc(state.q.hint)}</div>`}function reveal(){state.answered=true;state.selected=-1;recordAnswer(state.q,state.sub,state.level,false);render()}function resetStats(){if(confirm('Vols eliminar les estadístiques desades en aquest navegador?')){state.attempts=0;state.right=0;state.streak=0;state.missStreak=0;state.history={};save();render()}}function showTheory(){state.theory=true;render()}function closeTheory(){state.theory=false;render()}function theoryModal(){return `<div class="modalback" onclick="if(event.target===this)closeTheory()"><div class="modal" role="dialog" aria-modal="true"><div class="modaltop"><div><div class="eyebrow">APUNTS RÀPIDS</div><h2>${units.find(x=>x.id===state.u).name}</h2></div><button class="close" aria-label="Tanca" onclick="closeTheory()">×</button></div>${theory[state.u].map(t=>`<div class="theoryitem"><b>${t[0]}</b><p>${t[1]}</p><div class="smallmath" data-tex="${esc(t[2])}"></div></div>`).join('')}<div class="actions"><button class="primary" onclick="closeTheory()">Torna a practicar</button></div></div></div>`}
function toggleKeyboard(){state.keyboard=!state.keyboard;render()}function keyboardHtml(){let keys=['7','8','9','+','−','×','÷','4','5','6','(',')','x','y','1','2','3','²','³','√','^','0','.',',','=','/','⌫','Neteja'];return `<div class="problemstage"><b>La meva llibreta matemàtica</b><p class="note">Espai d’esborrany; no cal reescriure l’enunciat ni la fórmula. Pots escriure amb el teclat físic o prémer els botons.</p><input class="kbdinput" id="scratch" aria-label="Esborrany matemàtic" value="${esc(state.kinput)}" oninput="state.kinput=this.value" placeholder="Escriu només els passos que necessitis"><div class="kbd">${keys.map(key=>`<button class="key" onclick="keyPress('${key}')">${key}</button>`).join('')}</div><div class="note">La llibreta és lliure: la correcció automàtica d’aquesta versió es fa mitjançant les opcions de resposta.</div></div>`}function keyPress(k){let inp=$('#scratch');if(!inp)return;if(k==='Neteja'){inp.value=''}else if(k==='⌫'){inp.value=inp.value.slice(0,-1)}else{inp.value+=k};state.kinput=inp.value;inp.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.theory)closeTheory();else if(state.guided)exitGuide()}});restore();next();
</script></body></html>
